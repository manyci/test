<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050306">
<title>NO EXIT: EXTREME TABOO</title>
<style>
:root{
  --bg:#050306; --bg2:#0b0710; --surf:#150d1f; --surf2:#1e1230; --line:#2c1b44;
  --wine:#7a0f2a; --wine2:#a3153a; --red:#e11d48; --txt:#efe8f4; --dim:#9a8cab; --faint:#5d4f70;
  --t:0; /* tension 0..1 */
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 0%,rgba(122,15,42,calc(.18 + var(--t)*.35)) 0%,transparent 60%),var(--bg);transition:background .8s}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:50;
  box-shadow:inset 0 0 calc(60px + var(--t)*120px) rgba(225,29,72,calc(var(--t)*.35));transition:box-shadow .8s}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.on{display:flex;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.logo{font-family:var(--serif);font-weight:700;letter-spacing:.32em;text-transform:uppercase;text-align:center}
.logo b{display:block;font-size:44px;color:var(--txt);text-shadow:0 0 30px rgba(225,29,72,.5)}
.logo small{display:block;margin-top:6px;font-family:var(--sans);font-size:11px;letter-spacing:.5em;color:var(--red);font-weight:600}
.h1{font-family:var(--serif);font-size:26px;margin:8px 0 4px}
.sub{color:var(--dim);font-size:14px;line-height:1.45}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;padding:0 20px;font-weight:600;letter-spacing:.04em;transition:transform .12s,background .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,var(--wine2),var(--wine));box-shadow:0 8px 30px rgba(163,21,58,.35)}
.btn.sec{background:var(--surf);border:1px solid var(--line)}
.btn.ghost{color:var(--dim);min-height:44px}
.btn.dng{background:#3a0a16;border:1px solid var(--wine2);color:#ffb3c4}
.btn[disabled]{opacity:.35;pointer-events:none}
.row{display:flex;gap:10px}.row>*{flex:1}
.col{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1;min-height:12px}
.card{background:linear-gradient(180deg,var(--surf2),var(--surf));border:1px solid var(--line);border-radius:18px;padding:16px}
.mode{display:flex;flex-direction:column;gap:4px;text-align:left;align-items:flex-start;padding:16px 18px;min-height:84px}
.mode .t{font-family:var(--serif);font-size:20px;letter-spacing:.12em}
.mode .d{font-size:13px;color:var(--dim);font-weight:400;letter-spacing:0}
.nav{display:flex;border-top:1px solid var(--line);margin:14px -18px calc(-1*max(18px,env(safe-area-inset-bottom)));padding-bottom:env(safe-area-inset-bottom);background:var(--bg2)}
.nav button{flex:1;padding:14px 0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.nav button.on{color:var(--red)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;min-height:40px}
.iconbtn{width:44px;height:44px;border-radius:12px;background:var(--surf);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px}
/* category chips */
.cat{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surf);text-align:left;width:100%;transition:border-color .2s,background .2s}
.cat.on{border-color:var(--wine2);background:linear-gradient(90deg,rgba(163,21,58,.25),var(--surf))}
.cat .n{font-family:var(--serif);color:var(--faint);width:28px;font-size:15px}
.cat .nm{flex:1;font-size:14px;font-weight:600;letter-spacing:.06em}
.cat .ds{font-size:11px;color:var(--dim);font-weight:400;display:block;margin-top:2px;letter-spacing:0}
.cat .ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--faint);display:flex;align-items:center;justify-content:center;font-size:13px}
.cat.on .ck{background:var(--wine2);border-color:var(--wine2)}
.heavy{font-size:10px;color:var(--red);border:1px solid var(--wine2);border-radius:6px;padding:1px 5px;margin-left:6px;letter-spacing:.1em;vertical-align:middle}
.catwrap{display:flex;gap:8px;align-items:stretch}
.hide{width:44px;border-radius:14px;border:1px solid var(--line);background:var(--surf);color:var(--faint);font-size:16px;flex:none}
/* game */
.gtop{display:flex;align-items:center;gap:12px}
.gmeta{flex:1;min-width:0}
.gmeta .q{font-size:11px;letter-spacing:.25em;color:var(--dim)}
.gmeta .c{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{position:relative;width:54px;height:54px;flex:none}
.timer svg{transform:rotate(-90deg)}
.timer .bg{stroke:var(--line)}
.timer .fg{stroke:var(--wine2);transition:stroke-dashoffset .25s linear,stroke .3s}
.timer .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.timer.low .fg{stroke:var(--red)}
.timer.low{animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.09);filter:drop-shadow(0 0 8px var(--red))}}
.prog{height:4px;background:var(--surf);border-radius:4px;margin:14px 0;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--wine),var(--red));transition:width .5s}
.dil{font-family:var(--serif);font-size:clamp(19px,5.2vw,24px);line-height:1.38;text-align:center;padding:8px 4px 14px;flex:none}
.choices{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.ch{flex:1;min-height:110px;position:relative;text-align:left;padding:16px 16px 16px 62px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(160deg,var(--surf2),var(--surf));display:flex;align-items:center;font-size:clamp(15px,4.2vw,17px);line-height:1.4;transition:transform .2s,border-color .2s,opacity .35s,box-shadow .3s}
.ch .L{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:10px;background:var(--bg);border:1px solid var(--wine2);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;color:var(--red)}
.ch:active{transform:scale(.985)}
.ch.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 40px rgba(225,29,72,.4);background:linear-gradient(160deg,#4a0f26,#230a1a);animation:pop .45s}
.ch.sel .L{background:var(--red);color:#fff}
.ch.off{opacity:.18;transform:scale(.97)}
@keyframes pop{40%{transform:scale(1.025)}}
.flash{position:fixed;inset:0;background:var(--red);opacity:0;pointer-events:none;z-index:60}
.flash.go{animation:fl .4s}
@keyframes fl{0%{opacity:.22}100%{opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bigname{font-family:var(--serif);font-size:34px;text-align:center;margin:10px 0}
/* results */
.bar{height:12px;border-radius:8px;background:var(--surf);overflow:hidden;display:flex}
.bar .a{background:var(--wine2)}.bar .b{background:#6d3fb2}
.lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin:6px 0 0}
.arch{text-align:center;padding:22px 16px;border-color:var(--wine2);background:radial-gradient(100% 120% at 50% 0%,rgba(163,21,58,.35),var(--surf))}
.arch .nm{font-family:var(--serif);font-size:28px;letter-spacing:.1em;text-transform:uppercase}
.arch .ds{color:var(--dim);margin-top:8px;font-size:14px;line-height:1.45}
.arch .tag{font-size:10px;letter-spacing:.3em;color:var(--red)}
.stat{display:flex;gap:10px}
.stat .card{flex:1;text-align:center;padding:14px 8px}
.stat b{display:block;font-family:var(--serif);font-size:26px}
.stat span{font-size:11px;color:var(--dim);letter-spacing:.08em}
.sec-t{font-size:11px;letter-spacing:.28em;color:var(--red);margin:18px 0 8px;text-transform:uppercase}
.li{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.4}
.li:last-child{border:0}
.li small{display:block;color:var(--dim);margin-top:4px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:500;font-size:11px}
td:first-child,th:first-child{text-align:left}
.pa{color:#ff8aa5}.pb{color:#b79cff}
input[type=text],textarea{width:100%;background:var(--surf);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:13px;font:inherit;font-size:16px;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--wine2)}
textarea{min-height:140px;resize:vertical}
.seg{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:10px 0;border-radius:9px;font-size:13px;color:var(--dim)}
.seg button.on{background:var(--wine);color:#fff}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.82);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px)}
.modal.on{display:flex;animation:in .25s}
.modal .box{width:100%;max-width:520px;background:var(--bg2);border:1px solid var(--wine2);border-radius:22px 22px 0 0;padding:22px 18px max(22px,env(safe-area-inset-bottom))}
.modal h3{font-family:var(--serif);font-size:22px;margin:0 0 8px}
.modal p{color:var(--dim);font-size:14px;line-height:1.5;margin:0 0 16px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--surf2);border:1px solid var(--wine2);padding:10px 16px;border-radius:12px;font-size:13px;z-index:120;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.gate{justify-content:center;text-align:center}
.age{font-family:var(--serif);font-size:96px;color:var(--red);line-height:1;text-shadow:0 0 40px rgba(225,29,72,.5);margin:18px 0}
.pill{display:inline-block;font-size:11px;letter-spacing:.1em;padding:3px 8px;border-radius:8px;background:var(--surf2);border:1px solid var(--line);color:var(--dim)}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:6px}
.step button{width:44px;height:40px;font-size:20px;border-radius:9px}
.step b{font-size:17px;font-variant-numeric:tabular-nums}
.prow{display:flex;gap:8px;margin-bottom:8px}
@media (max-height:640px){.ch{min-height:84px}.logo b{font-size:36px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<div id="app">
<div class="screen" id="s-gate"></div>
<div class="screen" id="s-locked"></div>
<div class="screen" id="s-home"></div>
<div class="screen" id="s-setup"></div>
<div class="screen" id="s-handoff"></div>
<div class="screen" id="s-game"></div>
<div class="screen" id="s-results"></div>
<div class="screen" id="s-stats"></div>
<div class="screen" id="s-settings"></div>
</div>
<div id="vignette"></div>
<div class="flash" id="flash"></div>
<div class="modal" id="modal"><div class="box" id="modal-box"></div></div>
<div class="toast" id="toast"></div>
<script>
const QDATA = {};
QDATA[1]=[
["Тренер детской секции, твой друг, ведёт себя с учениками тревожно. Доказательств нет, за него поручилась вся школа.","Сообщить в опеку без доказательств — можно сломать невиновного человека.","Молчать и наблюдать — если ты прав, дети всё это время рядом с ним."],
["Ты единственный, у кого есть копии заявлений детей, которые директор интерната годами прятал.","Отдать журналистам: интернат закроют, детей разбросают по другим местам.","Отдать внутренней комиссии: шанс, что всё замнут, но дети останутся на месте."],
["Твой отец — судья. Ты нашёл доказательства, что он закрыл дело влиятельного обвиняемого за взятку.","Обнародовать: отец сядет, семья развалится.","Промолчать: виновный остаётся на свободе."],
["Мать пострадавшего ребёнка умоляет не давать показания: суд сломает ребёнка. Без тебя дело развалится.","Дать показания.","Отказаться, оставив виновного безнаказанным."],
["Основатель фонда, кормящего тысячи детей, давно скрывает преступление. Доказательства у тебя.","Разоблачить: фонд закроется, тысячи детей останутся без помощи.","Молчать: фонд работает, а виновный остаётся во главе."],
["Ты врач и подозреваешь насилие над ребёнком в семье давних друзей. Ты можешь ошибаться.","Сообщить сразу — рискуя разрушить невиновную семью.","Дать родителям время объясниться — рискуя опоздать."],
["Аноним прислал список «причастных» к преступлениям против детей. Один из десяти в нём точно невиновен, кто — неизвестно.","Опубликовать весь список.","Уничтожить список."],
["Брат признался, что много лет назад совершил тяжкое преступление против ребёнка. Сейчас он тихо работает и помогает людям.","Сдать его полиции.","Хранить тайну и следить за ним до конца жизни."],
["Единственный свидетель — подросток, который сломается на допросе. Без допроса дело закроют.","Допросить: ребёнок получит травму.","Закрыть дело: виновный уйдёт."],
["Следствие предлагает сделку: виновный сдаст пятерых таких же, но сам получит минимальный срок.","Принять сделку.","Отказаться: он сядет надолго, остальные могут уйти."],
["Ты журналист. Если назвать имя обвиняемого до суда, его могут убить на улице. Он может быть виновен, а может нет.","Опубликовать сейчас.","Ждать суда, пока другие дети рядом с ним."],
["Ребёнок рассказал тебе тайну о взрослом родственнике и заставил поклясться молчать.","Нарушить клятву и сообщить.","Хранить доверие и защищать самому."],
["Твоя компания выяснила, что крупный клиент связан с преступной сетью, вредящей детям. Расторжение контракта — это банкротство и 300 увольнений.","Сообщить и разорить компанию.","Тихо расторгнуть контракт без объяснений."],
["Пострадавшая, уже взрослая, собирается расправиться с обидчиком. Ты можешь её остановить.","Остановить: виновный продолжит жить как жил.","Не вмешиваться и стать соучастником."],
["Опека просит подписать изъятие ребёнка из семьи по подозрению. Доказательств мало, детдом — не рай.","Подписать изъятие.","Оставить в семье под наблюдением."],
["Умерший национальный герой оказывается причастным к давнему преступлению. Пострадавшие молчали десятилетиями.","Обнародовать правду, разрушив память миллионов.","Похоронить правду вместе с ним."],
["Адвокат, твой друг, взялся защищать человека, который, как он знает, виновен. Он выиграет дело.","Слить конфиденциальные данные и разрушить карьеру друга.","Промолчать."],
["Мэр обещает построить детский центр на 500 мест, если ты уберёшь из статьи его брата, причастного к сокрытию.","Убрать упоминание.","Оставить, центра не будет."],
["Твоя дочь-подросток покрывает одноклассника, обвинённого в преступлении против младшей девочки.","Заставить дочь свидетельствовать: она потеряет друзей и безопасность.","Позволить ей молчать."],
["Суд оправдал человека, которого ты считаешь виновным в преступлении против детей. Он поселился рядом с твоим домом.","Вынести его имя публично и получить самосуд.","Молчать и жить рядом."]
];
QDATA[2]=[
["Сосед, которого ты знаешь с детства, возможно, связан с экстремистами. Есть только подозрения.","Сообщить: его семья пострадает, даже если ты ошибся.","Промолчать и ждать."],
["Твой младший брат втянулся в радикальную группу. Он пока никому не навредил.","Сдать его властям, он получит срок.","Вытаскивать сам, рискуя опоздать."],
["Чтобы предотвратить теракт, спецслужбы просят отпустить преступника, виновного в другом тяжком деянии.","Согласиться и отпустить.","Отказаться: он сядет, а теракт останется под вопросом."],
["Ты чиновник. Объявить об угрозе — значит вызвать панику и жертвы в давке. Молчать — рискнуть терактом.","Объявить.","Молчать и тихо усилить охрану."],
["Жена скрывала, что общалась с человеком из радикальной группы. Говорит, что давно порвала.","Сообщить властям.","Поверить и сохранить тайну."],
["Государство скрывает, что могло предотвратить трагедию. У тебя есть документы.","Опубликовать: доверие к службам рухнет.","Хранить молча."],
["После теракта ты узнал в задержанном человека из толпы, но не уверен до конца.","Опознать с неуверенностью.","Признаться в сомнениях: настоящий виновный может уйти."],
["Ты модератор платформы. Видео-манифест экстремистов можно удалить, но тогда пропадут улики.","Удалить.","Оставить для следствия, видео будет распространяться."],
["Переговорщик может солгать главарю и спасти 20 заложников, но ложь почти наверняка будет стоить жизней потом.","Солгать.","Сказать правду и потерять заложников."],
["Ты учитель. Ученик с агрессивной идеологией. Донос может сломать ему судьбу навсегда.","Сообщить.","Взять под личную ответственность."],
["Журналист получил интервью с организатором после трагедии. Публикация — реклама его идей. Молчание скроет правду.","Опубликовать.","Похоронить интервью."],
["Ты получил списки сторонников движения. Среди них друзья и родные, не все активны.","Передать списки.","Удалить."],
["Власти предлагают амнистию боевикам, сложившим оружие, включая тех, у кого кровь на руках.","Поддержать: мир ценой справедливости.","Отвергнуть: война продолжится."],
["Информатор внутри группы — невиновный человек. Раскроешь — его убьют, но спасёшь многих.","Раскрыть его.","Защитить, рискуя терактом."],
["Организатор нападения, убившего твою родственницу, готов дать имена за смягчение приговора.","Согласиться на смягчение.","Требовать максимума без имён."],
["Твоя компания продала оборудование клиенту, позже связанному с нападением. Признание — крах и обвинения сотрудникам.","Признаться.","Скрыть."],
["Бывший боевик раскаялся, но семьи погибших хотят мести. Он просит помощи с побегом.","Помочь скрыться.","Отказать: пусть отвечает."],

/* Колода: равномерно по категориям, без повторов, приоритет «ещё не виденных»,
   затем сортировка по нарастающему напряжению (позиция в категории + шум). */
function buildDeck(catIds, n, qstats) {
  const pools = catIds.map(id => {
    const list = shuffle(QUESTIONS.filter(q => q.c === id));
    list.sort((x, y) => ((qstats[x.id] || {}).seen || 0) - ((qstats[y.id] || {}).seen || 0));
    return list;
  });
  const picked = []; let guard = 0;
  while (picked.length < n && guard++ < 1000) {
    let any = false;
    for (const p of shuffle(pools.map((_, i) => i))) {
      if (picked.length >= n) break;
      if (pools[p].length) { picked.push(pools[p].shift()); any = true; }
    }
    if (!any) break;
  }
  return picked.map(q => ({q, k: q.i / 19 + rnd() * 0.4})).sort((x, y) => x.k - y.k).map(x => x.q);
}

function matchPct(a, b) { let m = 0; a.forEach((r, i) => { if (b[i] && b[i][1] === r[1]) m++; }); return a.length ? Math.round(m * 100 / a.length) : 0; }

/* Метрики игрока (ans = [[qid,choice,secs,timeout],...]) */
function metrics(ans, extra) {
  const n = ans.length || 1;
  const a = ans.filter(r => r[1] === "A").length;
  let alt = 0, streak = 1, maxS = 1;
  for (let i = 1; i < ans.length; i++) {
    if (ans[i][1] !== ans[i - 1][1]) { alt++; streak = 1; } else { streak++; if (streak > maxS) maxS = streak; }
  }
  return {
    n: ans.length, a, b: ans.length - a, aShare: a / n,
    avgT: ans.reduce((s, r) => s + r[2], 0) / n,
    alt: ans.length > 1 ? alt / (ans.length - 1) : 0.5,
    to: ans.filter(r => r[3]).length, maxS,
    ux: extra && extra.ux != null ? extra.ux : null,
    match: extra && extra.match != null ? extra.match : null
  };
}
function pickArchetype(m) {
  const big = m.n >= 8;
  const rules = {
    collapse: m.to >= 3,
    phil: m.avgT > 14,
    streak: big && m.maxS >= 7,
    disaster: big && m.aShare >= 0.75,
    cynic: big && m.aShare <= 0.25,
    chaos: m.alt >= 0.72,
    wolf: m.ux != null && m.ux >= 0.6,
    cold: m.avgT < 5 && m.to === 0,
    dipl: m.match != null && m.match >= 70,
    unpred: m.aShare >= 0.42 && m.aShare <= 0.58 && m.alt >= 0.45,
    sleep: m.alt < 0.3
  };
  for (const k of ARCH_ORDER) if (rules[k]) return k;
  return "gentle";
}

/* Самый неожиданный выбор игрока в сессии */
function unexpected(session, pi, qstatsBefore) {
  const me = session.pl[pi].a; const multi = session.pl.length > 1;
  const myA = me.filter(r => r[1] === "A").length / (me.length || 1);
  let best = null;
  me.forEach((r, k) => {
    let s;
    if (multi) {
      const others = session.pl.filter((_, j) => j !== pi);
      s = others.filter(o => o.a[k] && o.a[k][1] !== r[1]).length / others.length;
    } else {
      const st = qstatsBefore[r[0]];
      if (st && st.seen >= 1) s = (r[1] === "A" ? st.b : st.a) / st.seen;
      else s = r[1] === "A" ? 1 - myA : myA;
    }
    if (!best || s > best.s || (s === best.s && r[2] > best.t)) best = {s, qid: r[0], ch: r[1], t: r[2]};
  });
  return best;
}

/* Агрегаты по сессии: игроки, совпадения, спорные вопросы */
function analyzeSession(s, qstatsBefore) {
  const P = s.pl.length;
  const pairs = s.pl.map((p, i) => s.pl.map((o, j) => i === j ? null : matchPct(p.a, o.a)));
  const players = s.pl.map((p, i) => {
    const others = pairs[i].filter(v => v != null);
    const match = others.length ? others.reduce((x, y) => x + y, 0) / others.length : null;
    const ux = unexpected(s, i, qstatsBefore);
    const m = metrics(p.a, {ux: P > 1 && ux ? ux.s : null, match});
    return {name: p.n, m, ux, arch: pickArchetype(m), match};
  });
  const nq = s.pl[0].a.length;
  const qs = [];
  for (let k = 0; k < nq; k++) {
    const picks = s.pl.map(p => p.a[k] ? p.a[k][1] : null);
    const a = picks.filter(x => x === "A").length, b = picks.filter(x => x === "B").length;
    qs.push({k, qid: s.pl[0].a[k][0], picks, a, b, split: P > 1 ? 1 - Math.abs(a - b) / P : 0, agree: P > 1 && (a === 0 || b === 0)});
  }
  return {pairs, players, qs};
}

/* Агрегаты по всей истории */
function lifetime(sessions) {
  const all = []; sessions.forEach(s => s.pl.forEach(p => p.a.forEach(r => all.push(r))));
  const a = all.filter(r => r[1] === "A").length;
  const byCat = {};
  all.forEach(r => { const c = QMAP[r[0]] ? QMAP[r[0]].c : 0; if (!c) return; const e = byCat[c] || (byCat[c] = {a:0, b:0}); e[r[1] === "A" ? "a" : "b"]++; });
  const qst = buildQStats(sessions);
  const amb = Object.keys(qst).filter(id => QMAP[id] && qst[id].seen >= 2)
    .map(id => ({id, st: qst[id], score: 1 - Math.abs(qst[id].a - qst[id].b) / qst[id].seen}))
    .sort((x, y) => y.score - x.score || y.st.seen - x.st.seen).slice(0, 5);
  const multi = sessions.filter(s => s.pl.length > 1);
  let matchAvg = null;
  if (multi.length) {
    const vals = multi.map(s => { const an = analyzeSession(s, {}); const v = an.players.map(p => p.match).filter(x => x != null); return v.reduce((x, y) => x + y, 0) / v.length; });
    matchAvg = Math.round(vals.reduce((x, y) => x + y, 0) / vals.length);
  }
  let ux = null;
  sessions.forEach(s => { if (s.ux && QMAP[s.ux.q] && (!ux || s.ux.s > ux.s)) ux = s.ux; });
  return {total: all.length, a, b: all.length - a, byCat, amb, matchAvg, multiCount: multi.length, ux, sessions: sessions.length};
}

/* Импорт/экспорт */
function exportPayload() { return JSON.stringify({app:"noexit", v:1, exported:Date.now(), data:{sessions:store.sessions, settings:store.settings, hidden:store.hidden, sel:store.sel}}, null, 1); }
function importPayload(text) {
  let o; try { o = JSON.parse(text); } catch (e) { return {ok:false, msg:"Файл не является корректным JSON."}; }
  if (!o || o.app !== "noexit" || !o.data || !Array.isArray(o.data.sessions)) return {ok:false, msg:"Это не файл статистики NO EXIT."};
  const have = new Set(store.sessions.map(s => s.id)); let added = 0;
  o.data.sessions.forEach(s => {
    if (!s || typeof s.id !== "string" || have.has(s.id) || !Array.isArray(s.pl) || !s.pl.length) return;
    const pl = s.pl.map(p => ({n:String(p.n || "Игрок").slice(0, 20), a:(Array.isArray(p.a) ? p.a : []).filter(r => Array.isArray(r) && QMAP[r[0]] && (r[1] === "A" || r[1] === "B")).map(r => [r[0], r[1], +r[2] || 0, r[3] ? 1 : 0])}));
    if (!pl.every(p => p.a.length)) return;
    const ux = s.ux && QMAP[s.ux.q] ? {n:String(s.ux.n || ""), q:s.ux.q, ch:s.ux.ch === "B" ? "B" : "A", s:+s.ux.s || 0} : null;
    store.sessions.push({id:s.id, ts:+s.ts || Date.now(), mode:["solo","party","vs"].includes(s.mode) ? s.mode : "solo", cats:Array.isArray(s.cats) ? s.cats.filter(c => CAT_BY_ID[c]) : [], pl, ux});
    have.add(s.id); added++;
  });
  store.sessions.sort((x, y) => x.ts - y.ts);
  if (store.sessions.length > 500) store.sessions = store.sessions.slice(-500);
  persist();
  return {ok:true, msg:"Импортировано сессий: " + added};
}

function refreshSetupSel() { const el = $("#selcount"); if (el) el.textContent = setup.sel.length + "/" + visibleCats().length; const b = $("#startbtn"); if (b) b.disabled = !setup.sel.length; }

/* ---------- Игровая сессия ---------- */
let G = null; // состояние текущей сессии
function startGame() {
  closeModal();
  store.sel = setup.sel.slice(); persist();
  const qst = buildQStats(store.sessions);
  const deck = buildDeck(setup.sel, setup.n, qst);
  const names = setup.mode === "solo" ? ["Ты"] : setup.players.map((p, i) => (p || "").trim() || ("Игрок " + (i + 1)));
  G = {mode:setup.mode, cats:setup.sel.slice(), deck, n:deck.length, names, pl:names.map(n => ({n, a:[]})), pi:0, qi:0, qstatsBefore:qst, lock:false, t0:0, left:0, total:0, tid:null, paused:false};
  if (G.mode === "solo") beginTurn(); else showHandoff();
}
function showHandoff() {
  setTension(0.1);
  const first = G.pi === 0;
  $("#s-handoff").innerHTML = `<div class="top"><button class="iconbtn" data-act="stop" aria-label="Остановить игру">✕</button><span class="pill">${G.pi + 1} / ${G.pl.length}</span><div style="width:44px"></div></div><div class="spacer"></div>
  <div class="sub" style="text-align:center;letter-spacing:.3em;font-size:12px">${first ? "ПЕРВЫЙ ИГРОК" : "ПЕРЕДАЙТЕ УСТРОЙСТВО"}</div><div class="bigname">${esc(G.names[G.pi])}</div>
  <p class="sub" style="text-align:center;max-width:300px;margin:0 auto 24px">${G.n} дилемм подряд. Остальные не смотрят в экран, ответы скрыты до конца раунда.</p>
  <button class="btn pri" data-act="ready">Я готов</button><div class="spacer"></div>`;
  show("handoff");
}
function beginTurn() { G.qi = 0; G.lock = false; renderQuestion(); show("game"); }

function renderQuestion() {
  const q = G.deck[G.qi]; const t = store.settings.timer;
  G.lock = false; G.total = t; G.left = t; G.t0 = Date.now();
  setTension(G.n > 1 ? G.qi / (G.n - 1) : 0.5);
  const C = 2 * Math.PI * 24;
  $("#s-game").innerHTML = `<div class="gtop"><button class="iconbtn" data-act="stop" aria-label="Остановить игру">✕</button>
   <div class="gmeta"><div class="q">ВОПРОС ${G.qi + 1} / ${G.n}${G.mode !== "solo" ? " · " + esc(G.names[G.pi]).toUpperCase() : ""}</div><div class="c">${catLabel(q.c)}</div></div>
   <div class="timer" id="timer"><svg width="54" height="54" viewBox="0 0 54 54"><circle class="bg" cx="27" cy="27" r="24" fill="none" stroke-width="4"/><circle class="fg" id="tfg" cx="27" cy="27" r="24" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="num" id="tnum">${t ? t : "∞"}</div></div></div>
   <div class="prog"><i style="width:${(G.qi) / G.n * 100}%" id="pbar"></i></div>
   <div class="dil">${esc(q.t)}</div>
   <div class="choices"><button class="ch" data-act="pick" data-c="A"><span class="L">A</span><span>${esc(q.a)}</span></button><button class="ch" data-act="pick" data-c="B"><span class="L">B</span><span>${esc(q.b)}</span></button></div>`;
  requestAnimationFrame(() => { const p = $("#pbar"); if (p) p.style.width = ((G.qi + 1) / G.n * 100) + "%"; });
  startTimer();
}
function startTimer() {
  stopTimer();
  if (!store.settings.timer) return;
  G.deadline = Date.now() + G.left * 1000;
  G.tid = setInterval(tick, 200); tick();
}
function stopTimer() { if (G && G.tid) { clearInterval(G.tid); G.tid = null; } }
function tick() {
  if (!G || G.lock) return;
  const left = Math.max(0, (G.deadline - Date.now()) / 1000); G.left = left;
  const fg = $("#tfg"), num = $("#tnum"), tm = $("#timer"); if (!fg) return;
  fg.style.strokeDashoffset = (2 * Math.PI * 24 * (1 - left / G.total)).toFixed(1);
  num.textContent = Math.ceil(left); tm.classList.toggle("low", left <= 5);
  if (left <= 0) { stopTimer(); pick(rnd() < 0.5 ? "A" : "B", true); }
}
function pick(c, timeout) {
  if (!G || G.lock) return; G.lock = true; stopTimer(); buzz(timeout ? [30, 40, 30] : 18);
  const secs = Math.min(999, Math.round((Date.now() - G.t0) / 100) / 10);
  const q = G.deck[G.qi];
  G.pl[G.pi].a.push([q.id, c, G.mode === "solo" || true ? secs : secs, timeout ? 1 : 0]);
  document.querySelectorAll(".ch").forEach(el => { const on = el.dataset.c === c; el.classList.add(on ? "sel" : "off"); });
  const f = $("#flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  if (timeout) toast("Время вышло. Судьба выбрала за тебя.");
  setTimeout(nextQ, timeout ? 1100 : 650);
}
function nextQ() {
  if (!G) return;
  G.qi++;
  if (G.qi < G.n) { renderQuestion(); return; }
  if (G.mode === "solo") return finishGame();
  G.pi++;
  if (G.pi < G.pl.length) showHandoff(); else finishGame();
}
function stopDialog() {
  if (!G) return; G.paused = true; stopTimer(); if (G.deadline) G.left = Math.max(0.5, (G.deadline - Date.now()) / 1000);
  const have = G.mode === "solo" && G.pl[0].a.length >= 3;
  modal(`<h3>Остановить игру?</h3><p>Раунд не обязательно доигрывать. ${have ? "Можно посмотреть итоги по уже данным ответам." : "Прогресс этой сессии не сохранится."}</p><div class="col"><button class="btn sec" data-act="resume">Продолжить</button>${have ? '<button class="btn pri" data-act="finish-partial">Завершить и показать итоги</button>' : ""}<button class="btn dng" data-act="quit">Выйти без сохранения</button></div>`);
}
function resumeGame() {
  closeModal(); if (!G) return; G.paused = false;
  if (cur === "game" && !G.lock) { G.t0 = Date.now() - (G.total - G.left) * 1000; startTimer(); }
}
function quitGame() { closeModal(); stopTimer(); G = null; renderHome(); }
function finishGame() {
  stopTimer();
  const pl = G.pl.map(p => ({n:p.n, a:p.a.map(r => r.slice())}));
  const sess = {id:Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts:Date.now(), mode:G.mode, cats:G.cats, pl};
  const an = analyzeSession(sess, G.qstatsBefore);
  const bu = an.players.map((p, i) => p.ux ? Object.assign({i}, p.ux) : null).filter(Boolean).sort((x, y) => y.s - x.s)[0];
  if (bu) sess.ux = {n:pl[bu.i].n, q:bu.qid, ch:bu.ch, s:+bu.s.toFixed(2)};
  store.sessions.push(sess); if (store.sessions.length > 500) store.sessions = store.sessions.slice(-500);
  persist();
  closeModal(); renderResults(sess, an); G = null;
}

/* ---------- Результаты ---------- */
const pills = picks => picks.map(p => p ? `<span class="${p === "A" ? "pa" : "pb"}"><b>${p}</b></span>` : "·").join(" ");
function abBar(a, b) { const t = a + b || 1; return `<div class="bar"><div class="a" style="width:${a / t * 100}%"></div><div class="b" style="width:${b / t * 100}%"></div></div><div class="lbl"><span class="pa">A · ${a} (${pct(a, a + b)}%)</span><span class="pb">B · ${b} (${pct(b, a + b)}%)</span></div>`; }
function archCard(key, who) { const a = ARCHETYPES[key]; return `<div class="card arch"><div class="tag">${who ? esc(who).toUpperCase() + " · " : ""}ИГРОВОЙ АРХЕТИП</div><div class="nm">${a.name}</div><div class="ds">${a.ds}</div><div class="sub" style="font-size:11px;margin-top:10px">Шутка, а не диагноз.</div></div>`; }
const qText = id => QMAP[id] ? esc(QMAP[id].t) : "";
const ansText = (id, ch) => QMAP[id] ? esc(ch === "A" ? QMAP[id].a : QMAP[id].b) : "";

function renderResults(s, an) {
  setTension(0);
  const solo = s.mode === "solo";
  let h = `<div class="top"><span class="pill">${{solo:"SOLO", party:"PARTY", vs:"VS"}[s.mode]}</span><div class="logo" style="font-size:16px;letter-spacing:.3em">ИТОГИ</div><span class="pill">${an.qs.length} вопр.</span></div>`;
  if (solo) {
    const p = an.players[0], m = p.m;
    h += archCard(p.arch);
    h += `<div class="stat" style="margin-top:12px"><div class="card"><b>${m.n}</b><span>ОТВЕТОВ</span></div><div class="card"><b>${m.avgT.toFixed(1)}с</b><span>СРЕДНЕЕ ВРЕМЯ</span></div><div class="card"><b>${m.to}</b><span>ПО ТАЙМЕРУ</span></div></div>`;
    h += `<div class="sec-t">Распределение</div><div class="card">${abBar(m.a, m.b)}</div>`;
    const bc = {}; s.pl[0].a.forEach(r => { const c = QMAP[r[0]].c; const e = bc[c] || (bc[c] = {a:0, b:0}); e[r[1] === "A" ? "a" : "b"]++; });
    h += `<div class="sec-t">По категориям</div><div class="card">${Object.keys(bc).map(c => `<div class="li"><b style="font-size:12px;letter-spacing:.06em">${catLabel(+c)}</b>${abBar(bc[c].a, bc[c].b)}</div>`).join("")}</div>`;
    if (p.ux) h += `<div class="sec-t">Самый неожиданный выбор</div><div class="card"><div class="li" style="border:0;padding:0">${qText(p.ux.qid)}<small>Твой выбор: <b class="${p.ux.ch === "A" ? "pa" : "pb"}">${p.ux.ch}</b> — ${ansText(p.ux.qid, p.ux.ch)}</small></div></div>`;
    const slow = s.pl[0].a.slice().sort((x, y) => y[2] - x[2]).slice(0, 3);
    h += `<div class="sec-t">Дольше всего ты думал над</div><div class="card">${slow.map(r => `<div class="li">${qText(r[0])}<small>${r[2].toFixed(1)} с · выбрал ${r[1]}</small></div>`).join("")}</div>`;
  } else {
    const P = s.pl.length;
    if (s.mode === "vs") {
      const mt = an.pairs[0][1], same = an.qs.filter(q => q.agree).length;
      h += `<div class="card arch"><div class="tag">${esc(s.pl[0].n).toUpperCase()} × ${esc(s.pl[1].n).toUpperCase()}</div><div class="age" style="font-size:80px;margin:8px 0">${mt}%</div><div class="ds">совпадений · ${same} из ${an.qs.length}</div></div>`;
      h += `<div class="stat" style="margin-top:12px">${an.players.map(p => `<div class="card"><b>${p.m.a}/${p.m.b}</b><span>${esc(p.name).toUpperCase()} · A/B</span></div>`).join("")}</div>`;
    } else {
      h += `<div class="sec-t" style="margin-top:6px">Игроки</div><div class="card">${an.players.map(p => `<div class="li"><b>${esc(p.name)}</b> · <span class="pill">${ARCHETYPES[p.arch].name}</span><small>A ${p.m.a} / B ${p.m.b} · в среднем совпадает с остальными на ${Math.round(p.match)}%</small></div>`).join("")}</div>`;
      h += `<div class="sec-t">Совпадения</div><div class="card" style="overflow-x:auto"><table><tr><th></th>${an.players.map(p => `<th>${esc(p.name)}</th>`).join("")}</tr>${an.players.map((p, i) => `<tr><td>${esc(p.name)}</td>${an.pairs[i].map(v => `<td>${v == null ? "—" : v + "%"}</td>`).join("")}</tr>`).join("")}</table></div>`;
    }
    const dis = an.qs.filter(q => !q.agree).sort((x, y) => y.split - x.split).slice(0, s.mode === "vs" ? 8 : 5);
    h += `<div class="sec-t">Самые спорные вопросы</div><div class="card">${dis.length ? dis.map(q => `<div class="li">${qText(q.qid)}<small>${an.players.map((p, i) => `${esc(p.name)}: <b class="${q.picks[i] === "A" ? "pa" : "pb"}">${q.picks[i]}</b>`).join(" · ")}</small></div>`).join("") : `<div class="li">Вы совпали во всём. Это либо дружба, либо опасная секта.</div>`}</div>`;
    const ux = an.players.filter(p => p.ux && p.ux.s > 0).sort((x, y) => y.ux.s - x.ux.s)[0];
    if (ux) h += `<div class="sec-t">Самый неожиданный выбор</div><div class="card"><div class="li" style="border:0;padding:0">${qText(ux.ux.qid)}<small>${esc(ux.name)} выбрал <b class="${ux.ux.ch === "A" ? "pa" : "pb"}">${ux.ux.ch}</b> — ${ansText(ux.ux.qid, ux.ux.ch)}</small></div></div>`;
    h += `<div class="sec-t">Архетипы</div>` + an.players.map(p => archCard(p.arch, p.name)).join('<div style="height:10px"></div>');
    h += `<div class="sec-t">Все ответы</div><div class="card" style="overflow-x:auto"><table><tr><th>#</th>${an.players.map(p => `<th>${esc(p.name)}</th>`).join("")}</tr>${an.qs.map(q => `<tr><td>${q.k + 1}</td>${q.picks.map(p => `<td class="${p === "A" ? "pa" : "pb"}"><b>${p}</b></td>`).join("")}</tr>`).join("")}</table></div>`;
  }
  h += `<div style="height:16px"></div><div class="col"><button class="btn pri" data-act="again" data-mode="${s.mode}">Играть снова</button><button class="btn sec" data-act="go-home">В меню</button><button class="btn ghost" data-act="go-stats">Общая статистика</button></div>`;
  $("#s-results").innerHTML = h; show("results");
}

/* ---------- Статистика ---------- */
function renderStats() {
  setTension(0);
  const L = lifetime(store.sessions);
  let h = `<div class="logo" style="font-size:18px;letter-spacing:.3em;margin:10px 0 16px">СТАТИСТИКА</div>`;
  if (!L.total) h += `<div class="card" style="text-align:center"><p class="sub">Пока пусто. Сыграйте хотя бы одну партию.</p></div>`;
  else {
    h += `<div class="stat"><div class="card"><b>${L.total}</b><span>ВОПРОСОВ</span></div><div class="card"><b>${L.sessions}</b><span>ПАРТИЙ</span></div><div class="card"><b>${L.matchAvg == null ? "—" : L.matchAvg + "%"}</b><span>С ДРУЗЬЯМИ</span></div></div>`;
    h += `<div class="sec-t">Распределение A / B</div><div class="card">${abBar(L.a, L.b)}</div>`;
    h += `<div class="sec-t">По категориям</div><div class="card">${CATS.filter(c => L.byCat[c.id]).map(c => `<div class="li"><b style="font-size:12px;letter-spacing:.06em">${catLabel(c.id)}</b>${abBar(L.byCat[c.id].a, L.byCat[c.id].b)}</div>`).join("") || "—"}</div>`;
    h += `<div class="sec-t">Самые неоднозначные дилеммы</div><div class="card">${L.amb.length ? L.amb.map(x => `<div class="li">${qText(x.id)}<small>A ${x.st.a} · B ${x.st.b} · ${Math.round(x.score * 100)}% разброса</small></div>`).join("") : `<div class="li" style="border:0">Нужны вопросы, на которые отвечали хотя бы дважды (PARTY, VS или повторные партии).</div>`}</div>`;
    h += `<div class="sec-t">Самый неожиданный выбор</div><div class="card">${L.ux ? `<div class="li" style="border:0;padding:0">${qText(L.ux.q)}<small>${esc(L.ux.n)} выбрал <b class="${L.ux.ch === "A" ? "pa" : "pb"}">${L.ux.ch}</b> — ${ansText(L.ux.q, L.ux.ch)}</small></div>` : "—"}</div>`;
  }
  h += `<div class="spacer"></div>${nav("stats")}`;
  $("#s-stats").innerHTML = h; show("stats");
}

/* ---------- Настройки ---------- */
function renderSettings() {
  setTension(0);
  const t = store.settings.timer;
  let h = `<div class="logo" style="font-size:18px;letter-spacing:.3em;margin:10px 0 16px">НАСТРОЙКИ</div>
  <div class="sec-t" style="margin-top:0">Таймер на вопрос</div><div class="seg">${[[15, "15с"], [30, "30с"], [45, "45с"], [60, "60с"], [0, "Выкл"]].map(([v, l]) => `<button data-act="timer" data-v="${v}" class="${t === v ? "on" : ""}">${l}</button>`).join("")}</div>
  <p class="sub" style="font-size:12px;margin:8px 0 0">Вопрос нельзя пропустить: когда время выходит, выбор делает случай.</p>
  <div class="sec-t">Вибрация</div><div class="seg"><button data-act="haptics" data-v="1" class="${store.settings.haptics ? "on" : ""}">Вкл</button><button data-act="haptics" data-v="0" class="${!store.settings.haptics ? "on" : ""}">Выкл</button></div>
  <div class="sec-t">Скрытые категории</div>${store.hidden.length ? `<div class="card">${store.hidden.map(id => `<div class="li" style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span>${catLabel(id)}</span><button class="btn sec" style="min-height:38px;padding:0 14px;font-size:13px" data-act="unhide" data-id="${id}">Показать</button></div>`).join("")}</div>` : `<p class="sub" style="font-size:13px">Нет скрытых. Скрыть категорию можно на экране выбора кнопкой ⊘.</p>`}
  <div class="sec-t">Данные</div><div class="col" style="gap:8px"><button class="btn sec" data-act="export">Экспорт статистики (файл)</button><button class="btn sec" data-act="copy">Скопировать статистику</button><button class="btn sec" data-act="import-open">Импорт статистики</button><button class="btn dng" data-act="reset">Стереть всю статистику</button></div>
  <div class="sec-t">О приложении</div><p class="sub" style="font-size:13px">Для взрослых 18+. Все дилеммы вымышлены, без графического насилия и без инструкций. Пользовательских публичных вопросов в этой версии нет, данные хранятся только на вашем устройстве.</p>
  <div class="spacer"></div>${nav("settings")}`;
  $("#s-settings").innerHTML = h; show("settings");
}
function downloadExport() {
  try {
    const blob = new Blob([exportPayload()], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "no-exit-stats.json";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast("Файл экспортирован");
  } catch (e) { toast("Не удалось сохранить файл, используйте «Скопировать»"); }
}
function copyExport() {
  const t = exportPayload();
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast("Скопировано в буфер"), () => fallbackCopy(t)); else fallbackCopy(t);
}
function fallbackCopy(t) { modal(`<h3>Статистика</h3><p>Скопируйте текст вручную:</p><textarea readonly id="cp">${esc(t)}</textarea><div style="height:12px"></div><button class="btn sec" data-act="modal-close">Закрыть</button>`); const e = $("#cp"); if (e) { e.focus(); e.select(); } }
function importDialog() {
  modal(`<h3>Импорт статистики</h3><p>Вставьте текст экспорта или выберите файл. Данные добавятся к текущим.</p><textarea id="imp" placeholder='{"app":"noexit",...}'></textarea><div style="height:10px"></div><input type="file" id="impf" accept=".json,application/json" style="color:var(--dim);margin-bottom:12px;width:100%"><div class="col"><button class="btn pri" data-act="import-go">Импортировать</button><button class="btn sec" data-act="modal-close">Отмена</button></div>`);
  $("#impf").addEventListener("change", e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $("#imp").value = String(r.result); }; r.readAsText(f); });
}

/* ---------- События ---------- */
const ACT = {
  "age-yes"() { store.adult = true; persist(); renderHome(); },
  "age-no"() { renderLocked(); show("locked"); },
  "go-home"() { if (G) return; renderHome(); },
  "go-stats"() { renderStats(); },
  "go-settings"() { renderSettings(); },
  mode(d) { openSetup(d.mode); },
  again(d) { openSetup(d.mode); },
  cat(d) { const id = +d.id, i = setup.sel.indexOf(id); if (i >= 0) setup.sel.splice(i, 1); else setup.sel.push(id); const el = document.querySelector(`.cat[data-id="${id}"]`); const on = i < 0; el.classList.toggle("on", on); el.querySelector(".ck").textContent = on ? "✓" : ""; refreshSetupSel(); },
  "cat-all"() { setup.sel = visibleCats().map(c => c.id); renderSetup(); },
  "cat-light"() { setup.sel = visibleCats().filter(c => !c.heavy).map(c => c.id); renderSetup(); },
  "cat-hide"(d) { const id = +d.id; if (visibleCats().length <= 1) return toast("Должна остаться хотя бы одна категория"); store.hidden.push(id); setup.sel = setup.sel.filter(x => x !== id); store.sel = store.sel.filter(x => x !== id); persist(); renderSetup(); toast("Категория скрыта. Вернуть: Настройки"); },
  unhide(d) { store.hidden = store.hidden.filter(x => x !== +d.id); persist(); renderSettings(); },
  "pl-add"() { setup.players.push("Игрок " + (setup.players.length + 1)); renderSetup(); },
  "pl-del"(d) { setup.players.splice(+d.i, 1); renderSetup(); },
  setn(d) { setup.n = +d.v; renderSetup(); },
  start() { tryStart(); },
  "start-ok"() { startGame(); },
  "modal-close"() { closeModal(); },
  ready() { beginTurn(); },
  pick(d) { pick(d.c, false); },
  stop() { stopDialog(); },
  resume() { resumeGame(); },
  quit() { quitGame(); },
  "finish-partial"() { closeModal(); G.n = G.pl[0].a.length; finishGame(); },
  timer(d) { store.settings.timer = +d.v; persist(); renderSettings(); },
  haptics(d) { store.settings.haptics = d.v === "1"; persist(); renderSettings(); },
  export() { downloadExport(); },
  copy() { copyExport(); },
  "import-open"() { importDialog(); },
  "import-go"() { const r = importPayload(($("#imp").value || "").trim()); closeModal(); toast(r.msg); if (r.ok) renderSettings(); },
  reset() { modal(`<h3>Стереть статистику?</h3><p>Все сохранённые партии будут удалены. Это нельзя отменить.</p><div class="col"><button class="btn dng" data-act="reset-ok">Стереть</button><button class="btn sec" data-act="modal-close">Отмена</button></div>`); },
  "reset-ok"() { store.sessions = []; persist(); closeModal(); toast("Статистика стёрта"); renderSettings(); }
};
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const f = ACT[t.dataset.act]; if (f) f(t.dataset, t);
});
document.addEventListener("input", e => { const i = e.target.dataset && e.target.dataset.pl; if (i != null && setup) setup.players[+i] = e.target.value; });
document.addEventListener("keydown", e => {
  if (cur !== "game" || !G || G.lock || $("#modal").classList.contains("on")) return;
  if (e.key === "a" || e.key === "A" || e.key === "1") pick("A", false);
  if (e.key === "b" || e.key === "B" || e.key === "2") pick("B", false);
});
document.addEventListener("visibilitychange", () => {
  if (!G || cur !== "game" || G.lock || G.paused) return;
  if (document.hidden) { stopTimer(); G.left = Math.max(0.5, (G.deadline - Date.now()) / 1000); }
  else { G.t0 = Date.now() - (G.total - G.left) * 1000; startTimer(); }
});
$("#modal").addEventListener("click", e => { if (e.target.id === "modal" && !G) closeModal(); });

/* ---------- Старт ---------- */
(function init() {
  renderGate(); renderLocked();
  if (store.adult) renderHome(); else show("gate");
  window.__NOEXIT = {QUESTIONS, CATS, ARCHETYPES, buildDeck, pickArchetype, metrics, analyzeSession, lifetime, importPayload, exportPayload, get store() { return store; }};
})();

</script>
</body>
</html>
